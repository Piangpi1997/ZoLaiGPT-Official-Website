<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="robots" content="noindex,nofollow"><title>ZoLaiGPT responsive QA</title><style>body{margin:0;background:#181320;color:#eee;font:14px system-ui}header{position:sticky;top:0;z-index:10;background:#211a30;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px}button{padding:10px;border-radius:6px;border:1px solid #9a87ba;background:#302445;color:white;min-height:44px}iframe{display:block;border:0;background:#0c0a16;width:390px;height:850px}label{display:flex;align-items:center;gap:8px}input{min-height:32px;width:70px}</style></head><body><header><strong>Responsive QA · iframe viewport</strong><button data-width="320">320px</button><button data-width="360">360px</button><button data-width="390">390px</button><button data-width="768">768px</button><button data-width="926">926px</button><button data-width="1280">1280px</button><button data-width="1440">1440px</button><button id="mode">Open chat workspace</button><label>Height <input id="height" type="number" value="850" min="300"></label><output id="status">390px · Homepage</output></header><iframe title="ZoLaiGPT test viewport" id="preview-frame" src="./"></iframe><script>const frame=document.getElementById('preview-frame'),status=document.getElementById('status');let width=390,chat=false;function sync(){status.textContent=width+'px · '+(chat?'Chat workspace':'Homepage')}for(const button of document.querySelectorAll('[data-width]'))button.addEventListener('click',()=>{width=Number(button.dataset.width);frame.style.width=width+'px';sync()});document.getElementById('height').addEventListener('input',e=>frame.style.height=Math.max(300,Number(e.target.value))+'px');document.getElementById('mode').addEventListener('click',e=>{chat=!chat;frame.src=chat?'chat/':'./';e.target.textContent=chat?'Open homepage':'Open chat workspace';sync()})</script></body></html>
